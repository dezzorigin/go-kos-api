name: CI

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go (fmt, vet, test, build, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...
      - name: go build
        run: go build -o /tmp/go-kos-api .
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  landing:
    name: Landing page (HTML validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: html-validate
        run: npx --yes html-validate@8 landing/index.html
