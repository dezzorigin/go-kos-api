<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340" role="img" aria-label="Diagram arsitektur go-kos-api">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect width="920" height="340" fill="#f8fafc"/>
  <text x="40" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#0f172a">go-kos-api — arsitektur</text>
  <text x="40" y="70" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">Go + Fiber v2 · penyimpanan in-memory · tanpa database</text>

  <!-- Client -->
  <g>
    <rect x="40" y="110" width="200" height="110" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <text x="140" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Client</text>
    <text x="140" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">curl · browser</text>
    <text x="140" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">aplikasi pencari kos</text>
  </g>

  <!-- Fiber -->
  <g>
    <rect x="360" y="110" width="200" height="110" rx="12" fill="#0f172a"/>
    <text x="460" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Fiber v2</text>
    <text x="460" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">router + logger</text>
    <text x="460" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">6 route · validasi</text>
  </g>

  <!-- Store -->
  <g>
    <rect x="680" y="110" width="200" height="110" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <text x="780" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Store</text>
    <text x="780" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">[]Kos in-memory</text>
    <text x="780" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">sync.RWMutex</text>
  </g>

  <!-- Arrows -->
  <line x1="240" y1="165" x2="350" y2="165" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="295" y="150" text-anchor="middle" font-family="monospace" font-size="12" fill="#64748b">HTTP JSON</text>
  <line x1="560" y1="165" x2="670" y2="165" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="615" y="150" text-anchor="middle" font-family="monospace" font-size="12" fill="#64748b">CRUD</text>

  <!-- Routes strip -->
  <g font-family="monospace" font-size="12" fill="#0f172a">
    <rect x="40" y="250" width="840" height="52" rx="10" fill="#e2e8f0"/>
    <text x="60" y="274">GET /health · GET /api/kos · GET /api/kos/:id</text>
    <text x="60" y="294">POST /api/kos · PUT /api/kos/:id · DELETE /api/kos/:id</text>
  </g>
</svg>
